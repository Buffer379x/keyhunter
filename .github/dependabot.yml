# Dependency updates (SEC-10): one weekly pull request per ecosystem. Base image digests in the Dockerfiles and the
# pinned action commits are updated by the docker and github-actions entries.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /
      - /deploy
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
