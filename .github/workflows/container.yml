name: Publish container

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-keyhunter-container
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Buffer379x/keyhunter' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Select the published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if [[ -z "$tag" ]]; then
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          fi
          [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Publish the release image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("backend/Cargo.toml", "rb"))["package"]["version"])')" = "$VERSION"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          version_ref="$image:$VERSION"
          if details=$(docker buildx imagetools inspect --raw "$version_ref" 2>&1); then
            # Older Unraid versions accept an OCI index, even for a single platform.
            case "$(jq -er '.mediaType' <<< "$details")" in
              application/vnd.oci.image.index.v1+json|application/vnd.docker.distribution.manifest.list.v2+json) ;;
              application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json)
                docker buildx imagetools create --prefer-index=true --tag "$version_ref" "$version_ref"
                ;;
              *)
                echo "Unexpected media type for the published image." >&2
                exit 1
                ;;
            esac
          elif [[ "$details" == *"no such manifest"* || "$details" == *"manifest unknown"* || "$details" == *"$version_ref: not found"* ]]; then
            docker build --platform linux/amd64 \
              --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
              --tag "$version_ref" .
            python3 deploy/check-unraid-data.py "$version_ref"
            docker push --platform linux/amd64 "$version_ref"
            docker buildx imagetools create --prefer-index=true --tag "$version_ref" "$version_ref"
          else
            printf '%s\n' "$details" >&2
            exit 1
          fi

          check_index() {
            docker buildx imagetools inspect --raw "$1" | jq -e '
              (.mediaType == "application/vnd.oci.image.index.v1+json"
                or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json")
              and any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64")
            ' >/dev/null
          }
          check_index "$version_ref"
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
            docker buildx imagetools create --tag "$image:latest" "$version_ref"
            check_index "$image:latest"
          fi
