name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check backend and frontend
        run: sh deploy/check.sh
      - name: Audit production dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: Run browser tests with the synthetic catalog
        env:
          KEYHUNTER_TEST_BROWSER_CHANNEL: chrome
        # 1.0: the e2e suite with the axe scan, then the WebKit run of the responsive checks in the Playwright image.
        timeout-minutes: 15
        run: sh deploy/browser-check.sh
      - name: Compare core views visually
        timeout-minutes: 8
        run: sh deploy/visual-check.sh
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-diffs
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check Unraid template and Compose configuration
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('deploy/unraid/keyhunter.xml')"
          docker compose config --quiet

  rust-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Audit Rust dependencies (RustSec)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: backend
