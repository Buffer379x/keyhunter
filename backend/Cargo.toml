[package]
name = "keyhunter"
version = "0.6.3"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
argon2 = "0.5.3"
axum = "0.8"
getrandom = "0.3"
hex = "0.4"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
scraper = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
